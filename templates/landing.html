{% extends 'base.html' %}

{% block content %}

<div style="
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    padding: 40px 20px;
">

    <div style="
        width: 75%;
        max-width: 900px;
        text-align: center;
        padding: 45px 40px;
    ">

        <h1 style="font-size: 2.8rem; color: #002D72; font-weight: 800; margin-bottom: 25px;">
            EZ Household
        </h1>

        <p style="
            font-size: 1.1rem;
            line-height: 1.8;
            color: #3b4a67;
            max-width: 800px;
            margin: 0 auto 40px auto;
        ">
            Budget, assets, liabilities, equity, projects, and calculators.
        </p>

        <a href="{% url 'dashboard' %}" style="
            display: inline-block;
            background: #6366F1;
            color: white;
            padding: 14px 35px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(99,102,241,0.3);
        ">
            Dashboard
        </a>

    </div>

</div>

{% endblock %}
