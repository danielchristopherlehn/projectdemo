{% extends 'base.html' %}

{% block content %}

<div style="max-width:700px; margin:60px auto; padding:30px;">

    <div style="
        background:white;
        border-radius:18px;
        padding:40px;
        box-shadow:0 6px 20px rgba(0,0,0,0.08);
    ">

        <h1 style="color:#002D62; text-align:center; margin-bottom:10px;">
            Contact Us
        </h1>

        <p style="text-align:center; color:#555; margin-bottom:30px;">
            Write your message below.
        </p>

        {% if success %}
            <div style="
                background:#dcfce7;
                color:#166534;
                padding:15px;
                border-radius:12px;
                margin-bottom:25px;
                text-align:center;
                font-weight:600;
            ">
                Your message has been sent successfully.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Your Name" required
                style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px; font-size:1rem; box-sizing:border-box;">

            <input type="email" name="email" placeholder="Your Email" required
                style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px; font-size:1rem; box-sizing:border-box;">

            <textarea name="message" rows="7" placeholder="Write your message here..." required
                style="width:100%; padding:14px; border:1px solid #ccc; border-radius:10px; font-size:1rem; resize:none; margin-bottom:20px; box-sizing:border-box;"></textarea>

            <button type="submit"
                style="width:100%; background:#002D62; color:white; border:none; padding:15px; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer;">
                Send Message
            </button>
        </form>

    </div>

</div>

{% endblock %}
