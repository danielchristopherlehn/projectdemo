{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<section class="card auth-card">
    <div class="auth-layout">
        <div class="auth-copy">
            <h1>Log In</h1>
            <p>Access your dashboard and projects.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div style="color:red;">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit">Log In</button>
        </form>
    </div>

    <p>
        Need an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</section>
{% endblock %}
